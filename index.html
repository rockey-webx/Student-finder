<!DOCTYPE html>
<html lang="en">

    <title>Student Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #4f46e5;
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 5px rgba(79, 70, 229, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #3730a3;
        }

        #result {
            display: none;
            margin-top: 22px;
            padding: 20px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 12px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        #result h2 {
            color: #15803d;
            font-size: 21px;
            margin-bottom: 15px;
            text-align: center;
        }

        #result p {
            color: #333;
            margin-bottom: 10px;
            font-size: 15px;
        }

        #message {
            margin-top: 15px;
            color: #dc2626;
            overflow-wrap: anywhere;
        }

        /* Tablet */
        @media (max-width: 768px) {
            body {
                padding: 18px;
            }

            .container {
                max-width: 420px;
                padding: 25px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 14px;
                align-items: center;
            }

            .container {
                width: 100%;
                max-width: 100%;
                padding: 22px 18px;
                border-radius: 15px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }

            input,
            button {
                font-size: 16px;
                padding: 13px;
            }

            #result {
                padding: 16px;
            }

            #result h2 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

function findStudent() {
    const input = document
        .getElementById("studentName")
        .value
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

    const result = document.getElementById("result");
    const message = document.getElementById("message");

    result.style.display = "none";
    message.textContent = "";

    if (input === "") {
        message.textContent = "Please enter a student name!";
        return;
    }

    const student = students.find(function(s) {
        const studentName = s.name
            .trim()
            .replace(/\s+/g, " ")
            .toLowerCase();

        return studentName === input;
    });

    if (student) {
        document.getElementById("name").textContent = student.name;
        document.getElementById("id").textContent = student.id;
        document.getElementById("className").textContent =
            student.className;

        result.style.display = "block";
    } else {
        message.textContent = "Student not found! Please check the name.";
    }
}

document.getElementById("studentName")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            findStudent();
        }
    });
